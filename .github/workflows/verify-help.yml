name: Verify Help navigation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  help-return:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check script syntax
        run: node --check script.js
      - name: Test return navigation and standalone app handling
        run: node --test tests/help-return.test.mjs

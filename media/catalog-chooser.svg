<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="670" viewBox="0 0 1120 670" role="img" aria-labelledby="ttl dsc"><title id="ttl">Add Catalog item</title><desc id="dsc">A diagram of the six current Add Item choices, with 3D Printing emphasized.</desc><rect width="1120" height="670" fill="#f3f6fa"/><rect x="26" y="22" width="1068" height="626" rx="18" fill="#ffffff" stroke="#d5dde8" stroke-width="2"/><rect x="26" y="22" width="1068" height="68" rx="18" fill="#1c3049"/><path d="M26 70h1068v20H26z" fill="#1c3049"/><text x="58" y="64" font-size="23" font-weight="700" fill="#fff" font-family="Arial, sans-serif">Add Catalog item</text><rect x="912" y="43" width="162" height="27" rx="14" fill="#d9e7f4"/><text x="993" y="61" fill="#284764" font-size="12" text-anchor="middle" font-weight="700" font-family="Arial, sans-serif">ILLUSTRATED GUIDE</text><text x="62" y="132" fill="#17324c" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start">What are you adding?</text><text x="62" y="165" fill="#596b7d" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Choose one starting point. You can change the item type in the editor.</text><rect x="62" y="198" width="477" height="110" rx="12" fill="#fff9e8" stroke="#bd9141" stroke-width="2"/><text x="86" y="236" fill="#1a3048" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">3D Printing</text><text x="86" y="264" fill="#526376" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Items you print. Print time and materials</text><text x="86" y="288" fill="#526376" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">are optional with Manual price.</text><circle cx="502" cy="228" r="22" fill="#a37b20"/><text x="502" y="235" font-size="22" fill="#fff" text-anchor="middle" font-weight="700" font-family="Arial, sans-serif">1</text><rect x="567" y="198" width="477" height="110" rx="12" fill="#fff" stroke="#d6dee8" stroke-width="2"/><text x="591" y="236" fill="#1a3048" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Handmade Products</text><text x="591" y="264" fill="#526376" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Crafts you make: soap, candles,</text><text x="591" y="288" fill="#526376" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">laser work and woodworking.</text><rect x="62" y="326" width="477" height="110" rx="12" fill="#fff" stroke="#d6dee8" stroke-width="2"/><text x="86" y="364" fill="#1a3048" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Buy &amp; Resell</text><text x="86" y="392" fill="#526376" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Purchase finished items,</text><text x="86" y="416" fill="#526376" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">including 3D prints, for resale.</text><rect x="567" y="326" width="477" height="110" rx="12" fill="#fff" stroke="#d6dee8" stroke-width="2"/><text x="591" y="364" fill="#1a3048" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Assembly / Gift Set</text><text x="591" y="392" fill="#526376" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Combine existing Catalog items</text><text x="591" y="416" fill="#526376" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">into a finished item.</text><rect x="62" y="454" width="477" height="110" rx="12" fill="#fff" stroke="#d6dee8" stroke-width="2"/><text x="86" y="492" fill="#1a3048" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Material, Part or Supply</text><text x="86" y="520" fill="#526376" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Filament, ingredients, purchased</text><text x="86" y="544" fill="#526376" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">parts and packaging.</text><rect x="567" y="454" width="477" height="110" rx="12" fill="#fff" stroke="#d6dee8" stroke-width="2"/><text x="591" y="492" fill="#1a3048" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Service / Labor</text><text x="591" y="520" fill="#526376" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Sell personalization, engraving</text><text x="591" y="544" fill="#526376" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">or other work.</text><text x="60" y="614" fill="#4d667d" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Example: choose 3D Printing for an item you print yourself.</text></svg>
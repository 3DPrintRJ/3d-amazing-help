<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="ttl dsc"><title id="ttl">Additional details &amp; Save</title><desc id="dsc">Optional Category creation stays in the Catalog editor; Save Item is a separate action from stock changes.</desc><rect width="1120" height="680" fill="#f3f6fa"/><rect x="26" y="22" width="1068" height="636" rx="18" fill="#ffffff" stroke="#d5dde8" stroke-width="2"/><rect x="26" y="22" width="1068" height="68" rx="18" fill="#1c3049"/><path d="M26 70h1068v20H26z" fill="#1c3049"/><text x="58" y="64" font-size="23" font-weight="700" fill="#fff" font-family="Arial, sans-serif">Additional details &amp; Save</text><rect x="912" y="43" width="162" height="27" rx="14" fill="#d9e7f4"/><text x="993" y="61" fill="#284764" font-size="12" text-anchor="middle" font-weight="700" font-family="Arial, sans-serif">ILLUSTRATED GUIDE</text><text x="62" y="131" fill="#1c354d" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">Additional details</text><text x="62" y="162" fill="#546c82" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Category and SKU are optional. You can leave them blank.</text><rect x="62" y="191" width="992" height="110" rx="12" fill="#fff" stroke="#d7dfe8" stroke-width="2"/><text x="83" y="228" fill="#2b4862" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">Category</text><text x="1030" y="228" fill="#708193" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="end">Optional</text><rect x="82" y="238" width="951" height="48" rx="8" fill="#f8fafb" stroke="#c8d1de" stroke-width="2"/><text x="107" y="268" fill="#334d65" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Choose or create category</text><path d="M992 253l10 10 10-10" stroke="#6a7c90" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="59" cy="212" r="22" fill="#a37b20"/><text x="59" y="219" font-size="22" fill="#fff" text-anchor="middle" font-weight="700" font-family="Arial, sans-serif">3</text><rect x="62" y="320" width="992" height="89" rx="12" fill="#fff" stroke="#d7dfe8" stroke-width="2"/><text x="83" y="348" fill="#2b4862" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">SKU</text><text x="1025" y="348" fill="#708193" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="end">Optional</text><rect x="82" y="359" width="951" height="36" rx="7" fill="#f8fafb" stroke="#c8d1de" stroke-width="2"/><text x="62" y="454" fill="#2d4962" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">After completing the required fields:</text><rect x="62" y="475" width="992" height="117" rx="12" fill="#f4f8fb" stroke="#d5dfea" stroke-width="2"/><rect x="82" y="495" width="196" height="56" rx="9" fill="#c39d40" stroke="#a27f32" stroke-width="2"/><text x="180" y="529" fill="#17293d" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Save Item</text><rect x="298" y="495" width="164" height="56" rx="9" fill="#fff" stroke="#bbc9d4" stroke-width="2"/><text x="380" y="529" fill="#526c81" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Cancel</text><text x="482" y="516" fill="#45657a" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Stock is recorded separately:</text><text x="482" y="541" fill="#45657a" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">Receive  •  Use  •  Adjust  •  Build</text><circle cx="1017" cy="521" r="22" fill="#a37b20"/><text x="1017" y="528" font-size="22" fill="#fff" text-anchor="middle" font-weight="700" font-family="Arial, sans-serif">4</text></svg>
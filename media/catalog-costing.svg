<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="ttl dsc"><title id="ttl">Optional pricing &amp; costing</title><desc id="dsc">Manual price needs fewer fields; Cost + markup can require print time and material.</desc><rect width="1120" height="660" fill="#f3f6fa"/><rect x="26" y="22" width="1068" height="616" rx="18" fill="#ffffff" stroke="#d5dde8" stroke-width="2"/><rect x="26" y="22" width="1068" height="68" rx="18" fill="#1c3049"/><path d="M26 70h1068v20H26z" fill="#1c3049"/><text x="58" y="64" font-size="23" font-weight="700" fill="#fff" font-family="Arial, sans-serif">Optional pricing &amp; costing</text><rect x="912" y="43" width="162" height="27" rx="14" fill="#d9e7f4"/><text x="993" y="61" fill="#284764" font-size="12" text-anchor="middle" font-weight="700" font-family="Arial, sans-serif">ILLUSTRATED GUIDE</text><text x="62" y="133" fill="#1b344f" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start">Print materials &amp; costing</text><text x="62" y="163" fill="#5d7284" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Open this only when you need to set up detailed costs.</text><rect x="62" y="195" width="990" height="82" rx="12" fill="#f7fafc" stroke="#cbd6e0" stroke-width="2"/><text x="84" y="228" fill="#28445d" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">Selling-price method</text><rect x="84" y="241" width="206" height="30" rx="8" fill="#eff7ed" stroke="#5d8556" stroke-width="2"/><text x="187" y="263" fill="#315b36" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">● Manual price</text><rect x="305" y="241" width="228" height="30" rx="8" fill="#fff" stroke="#bdc9d6" stroke-width="2"/><text x="419" y="263" fill="#49637a" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">○ Cost + markup</text><rect x="62" y="300" width="990" height="128" rx="12" fill="#f7fafc" stroke="#d3dce6" stroke-width="2"/><text x="84" y="335" fill="#234663" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start">With Manual price</text><text x="84" y="366" fill="#466278" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Material and print time are optional for a sellable printed item.</text><text x="84" y="398" fill="#677a89" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Use the simple Selling price above if you do not need calculated pricing.</text><rect x="62" y="452" width="990" height="128" rx="12" fill="#fff8e7" stroke="#c9a866" stroke-width="2"/><text x="84" y="488" fill="#735319" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start">If you choose Cost + markup instead</text><text x="84" y="519" fill="#6b552e" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">The editor requires a valid Filament / Material item and print time.</text><text x="84" y="551" fill="#7c6b4b" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">The calculated selling price uses your entered costs and multiplier.</text></svg>